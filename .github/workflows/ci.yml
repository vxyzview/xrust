name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust fmt/clippy/test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xrust-core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --lib -- --test-threads=2

  gradle:
    name: Kotlin build (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: Build Rust libraries for all ABIs
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked
          ./scripts/build-android-rust.sh
      - name: gradle assembleDebug
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
